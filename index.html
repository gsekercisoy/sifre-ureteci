<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifre Üreteci</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
    padding: 20px;
  }
  h1 { font-size: 1.5rem; }
  .panel {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .out {
    display: flex;
    gap: 8px;
    align-items: center;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px;
  }
  .out code {
    flex: 1;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 1.05rem;
    word-break: break-all;
    color: #4ade80;
    min-height: 1.4em;
  }
  .iconbtn {
    background: #273449;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: .95rem;
  }
  .iconbtn:hover { background: #334155; }
  .strength { height: 8px; border-radius: 999px; background: #273449; overflow: hidden; }
  .strength div { height: 100%; width: 0; border-radius: 999px; transition: all .3s; }
  .s-label { font-size: .82rem; color: #94a3b8; }
  .opt { display: flex; align-items: center; gap: 10px; font-size: .92rem; cursor: pointer; user-select: none; }
  .opt input { width: 17px; height: 17px; accent-color: #22c55e; cursor: pointer; }
  .len-row { display: flex; align-items: center; gap: 12px; }
  .len-row input[type=range] { flex: 1; accent-color: #22c55e; }
  .len-val { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.1rem; color: #4ade80; width: 34px; text-align: center; }
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    background: #22c55e;
    color: #052e16;
    border: none;
    padding: 11px;
    font-weight: 800;
    font-size: .95rem;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn.ghost { background: #273449; color: #e2e8f0; border: 1px solid #334155; }
  .btn:hover { filter: brightness(1.15); }
  .hist { display: flex; flex-direction: column; gap: 6px; }
  .hist b { color: #94a3b8; font-size: .78rem; text-transform: uppercase; letter-spacing: .6px; }
  .hist .item {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: #273449;
    border-radius: 8px;
    padding: 7px 10px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: .8rem;
  }
  .hist .item span { color: #64748b; }
  .muted { color: #64748b; font-size: .8rem; text-align: center; }
</style>
</head>
<body>
  <h1>🔐 Şifre Üreteci</h1>

  <div class="panel">
    <div class="out">
      <code id="pw">—</code>
      <button class="iconbtn" id="copyBtn" title="Kopyala">📋</button>
    </div>
    <div class="strength"><div id="bar"></div></div>
    <div class="s-label" id="sLabel">Uzunluk ve kuralları seç</div>

    <div class="len-row">
      <span>Uzunluk</span>
      <input type="range" id="len" min="6" max="40" value="16">
      <span class="len-val" id="lenVal">16</span>
    </div>

    <label class="opt"><input type="checkbox" id="cUp" checked> Büyük harf (A-Z)</label>
    <label class="opt"><input type="checkbox" id="cLo" checked> Küçük harf (a-z)</label>
    <label class="opt"><input type="checkbox" id="cDi" checked> Rakam (0-9)</label>
    <label class="opt"><input type="checkbox" id="cSy" checked> Sembol (!@#…)</label>
    <label class="opt"><input type="checkbox" id="cAm"> Karışanları çıkar (0/O, 1/l/I…)</label>

    <div class="actions">
      <button class="btn" id="genBtn">Üret</button>
      <button class="btn ghost" id="histClear">Geçmişi Temizle</button>
    </div>

    <div class="hist" id="hist">
      <b>Son 5 şifre (yalnızca bu oturumda)</b>
    </div>
  </div>

  <div class="muted">Şifreler tarayıcında üretilir, hiçbir yere gönderilmez.</div>

<script>
const sets = {
  up: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
  lo: 'abcdefghijklmnopqrstuvwxyz'.split(''),
  di: '0123456789'.split(''),
  sy: '!@#$%^&*()-_=+[]{};:,.<>?/~'.split('')
};
const ambiguous = ['0', 'O', 'o', '1', 'l', 'I', '|', 'B', '8'];

const lenEl = document.getElementById('len');
const lenVal = document.getElementById('lenVal');
const pwEl = document.getElementById('pw');
const bar = document.getElementById('bar');
const sLabel = document.getElementById('sLabel');
const histEl = document.getElementById('hist');
const histItems = [];

function pools() {
  const p = [];
  if (document.getElementById('cUp').checked) p.push(...sets.up);
  if (document.getElementById('cLo').checked) p.push(...sets.lo);
  if (document.getElementById('cDi').checked) p.push(...sets.di);
  if (document.getElementById('cSy').checked) p.push(...sets.sy);
  if (document.getElementById('cAm').checked) {
    return p.filter(ch => !ambiguous.includes(ch));
  }
  return p;
}

function randn(max) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function generate() {
  const pool = pools();
  const n = Number(lenEl.value);
  if (pool.length === 0) {
    pwEl.textContent = 'En az bir karakter türü seç!';
    return updateStrength(0, 'Kurallar geçersiz');
  }

  let pw = '';
  for (let i = 0; i < n; i++) pw += pool[randn(pool.length)];
  pwEl.textContent = pw;

  const entropy = n * Math.log2(pool.length);
  updateStrength(entropy, `Güvenlik: ~${Math.round(entropy)} bit entropi`);
  remember(pw);
}

function updateStrength(bits, label) {
  sLabel.textContent = label;
  const pct = Math.min(bits / 128 * 100, 100);
  bar.style.width = pct + '%';
  if (bits < 40) bar.style.background = '#f87171';
  else if (bits < 70) bar.style.background = '#fbbf24';
  else bar.style.background = '#22c55e';
}

function remember(pw) {
  histItems.unshift({ pw, at: new Date().toLocaleTimeString('tr-TR') });
  while (histItems.length > 5) histItems.pop();
  histEl.innerHTML = '<b>Son 5 şifre (yalnızca bu oturumda)</b>';
  histItems.forEach(h => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<div>${h.pw}</div><span>${h.at}</span>`;
    histEl.appendChild(d);
  });
}

document.getElementById('genBtn').onclick = generate;

document.getElementById('copyBtn').onclick = () => {
  const t = pwEl.textContent;
  if (!t || t === '—') return;
  navigator.clipboard.writeText(t).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = '✅';
    setTimeout(() => b.textContent = '📋', 900);
  });
};

document.getElementById('histClear').onclick = () => {
  histItems.length = 0;
  histEl.innerHTML = '<b>Son 5 şifre (yalnızca bu oturumda)</b>';
};

lenEl.addEventListener('input', () => {
  lenVal.textContent = lenEl.value;
  generate();
});
['cUp', 'cLo', 'cDi', 'cSy', 'cAm'].forEach(id => {
  document.getElementById(id).addEventListener('change', generate);
});

generate();
</script>
</body>
</html>
